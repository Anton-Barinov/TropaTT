name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Who benefits?
      description: Freelancers, teams, admins, project managers, clients, API users, etc.
  - type: textarea
    id: areas
    attributes:
      label: Affected areas
      description: Pages, API routes, installer, docs, permissions, AI, chat, automation, etc.
  - type: textarea
    id: risks
    attributes:
      label: Security, migration, or compatibility notes

name: Installation problem
description: Report a problem with the browser installer or deployment.
title: "[Install]: "
labels: ["installation"]
body:
  - type: dropdown
    id: hosting
    attributes:
      label: Hosting type
      options:
        - Shared hosting
        - Local
        - VPS
        - Cloud VM
        - Office/home server
        - Other
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
    validations:
      required: true
  - type: input
    id: mysql
    attributes:
      label: MySQL version
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: File permissions
      description: What paths are writable? Any hosting restrictions?
  - type: input
    id: step
    attributes:
      label: Installer step
      placeholder: "Environment check, database, admin, keys, final install"
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error message
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove passwords, database credentials, cookies, tokens, AI keys, and private data.
      render: text

name: Bug report
description: Report a reproducible problem in TropaTT.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, branch, or commit hash.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Local
        - Shared hosting
        - VPS
        - Cloud VM
        - Office/home server
        - Other
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.1.x"
  - type: input
    id: mysql
    attributes:
      label: MySQL version
  - type: input
    id: webserver
    attributes:
      label: Web server
      placeholder: "Apache, Nginx, hosting panel, built-in server"
  - type: input
    id: browser
    attributes:
      label: Browser
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs with secrets removed
      description: Remove passwords, cookies, CSRF tokens, Bearer tokens, AI keys, database credentials, and private data.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if relevant.

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">TropaTT browser installer</title><desc id="desc">Sanitized product screenshot illustration of the TropaTT browser installer.</desc><rect width="1440" height="900" fill="#eef5f2"/><rect x="180" y="100" width="1080" height="700" rx="18" fill="#fff" stroke="#d5e5df" stroke-width="2"/><rect x="180" y="100" width="1080" height="88" rx="18" fill="#102b2b"/><text x="235" y="155" fill="#fff" font-family="Arial" font-size="29" font-weight="700">TropaTT</text><text x="235" y="230" fill="#183333" font-family="Arial" font-size="30" font-weight="700">Welcome to the installer</text><text x="235" y="270" fill="#71827e" font-family="Arial" font-size="17">Set up your private workspace in a few simple steps.</text><g font-family="Arial"><circle cx="250" cy="340" r="20" fill="#17856f"/><text x="243" y="347" fill="#fff" font-size="16">✓</text><text x="290" y="347" fill="#183333" font-size="16" font-weight="700">Requirements checked</text><circle cx="250" cy="410" r="20" fill="#17856f"/><text x="243" y="417" fill="#fff" font-size="16">2</text><text x="290" y="417" fill="#183333" font-size="16" font-weight="700">Database connection</text><circle cx="250" cy="480" r="20" fill="#dce9e5"/><text x="243" y="487" fill="#55716b" font-size="16">3</text><text x="290" y="487" fill="#55716b" font-size="16">Administrator account</text><circle cx="250" cy="550" r="20" fill="#dce9e5"/><text x="243" y="557" fill="#55716b" font-size="16">4</text><text x="290" y="557" fill="#55716b" font-size="16">Finish</text><rect x="650" y="330" width="470" height="60" rx="8" fill="#f5f8f7" stroke="#d8e5e2"/><text x="680" y="367" fill="#8a9a97" font-size="15">Database host</text><rect x="650" y="420" width="470" height="60" rx="8" fill="#f5f8f7" stroke="#d8e5e2"/><text x="680" y="457" fill="#8a9a97" font-size="15">Database name</text><rect x="650" y="510" width="470" height="60" rx="8" fill="#f5f8f7" stroke="#d8e5e2"/><text x="680" y="547" fill="#8a9a97" font-size="15">Database user</text><rect x="1010" y="650" width="110" height="48" rx="8" fill="#17856f"/><text x="1033" y="681" fill="#fff" font-size="16" font-weight="700">Continue</text></g></svg>
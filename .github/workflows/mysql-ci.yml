name: MySQL Integration CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mysql-integration:
    name: MySQL-backed API integration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: tropatt_ci
          MYSQL_USER: tropatt
          MYSQL_PASSWORD: tropatt_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql

      - name: Run MySQL migration and API integration smoke test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tropatt_ci
          DB_USERNAME: tropatt
          DB_PASSWORD: tropatt_ci_password
        run: php upload/api/scripts/ci_mysql_smoke.php

# .gitleaks.toml
title = "TropaTT CRM Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Project-specific exclusions for TropaTT CRM"

paths = [
    # Test/seed data with fake keys — false positives
    "(?i)test",
    "(?i)sample",
    "(?i)example",
    # JS vendor libraries — not our code
    "web/assets/vendor/",
    # Database migrations — schema only, no secrets
    "migration/",
    # Documentation with examples
    "docs/",
    # SQL dumps
    "*.sql",
    # Staging update directories
    "storage_api/updates/staging/",
]

regexes = [
    # Exclude strings with "example" or "test" in the value
    "(?i)example\\.(com|org|net)",
    "(?i)your-secret-key",
    "(?i)changeme",
    # Exclude test credentials in documentation
    "(?i)admin.*adminadmin",
    # Exclude version strings that look like hashes
    "^[a-f0-9]{7,40}$",
]

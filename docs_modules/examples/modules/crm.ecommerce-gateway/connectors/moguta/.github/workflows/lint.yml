name: PHP lint

# Standalone CI for the `tropatt-moguta` connector repository.
# Moguta.CMS runs on PHP 7.4-8.2 in current versions, so the syntax check covers that range.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint plugin sources
        run: |
          set -euo pipefail
          mapfile -t files < <(find mg-plugins -name '*.php' -type f | sort)
          test ${#files[@]} -gt 0
          for file in "${files[@]}"; do
            php -l "${file}"
          done

  manifest:
    name: Validate plugin manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the plugin header and hooks
        run: |
          set -euo pipefail
          test -f mg-plugins/tropatt/tropatt.php
          grep -q "Plugin Name:" mg-plugins/tropatt/tropatt.php
          grep -q "mOrder_addOrder" mg-plugins/tropatt/tropatt.php
          grep -q "mOrder_updateOrder" mg-plugins/tropatt/tropatt.php
          grep -q "tropatt_crm_skip_status_sync" mg-plugins/tropatt/tropatt.php
          grep -q "tropattWebhook" mg-plugins/tropatt/ajax.php
          test -f mg-plugins/tropatt/pagePlugin.php
          echo "plugin manifest is complete"

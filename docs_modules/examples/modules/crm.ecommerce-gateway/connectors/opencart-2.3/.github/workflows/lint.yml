name: Lint

# Standalone CI for the `tropatt-opencart-2.3` connector repository.
# OpenCart 2.3 stores run anything from PHP 5.6 to 8.x, so the syntax check is
# repeated across the whole supported range.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.4', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint connector sources
        run: |
          set -euo pipefail
          mapfile -t files < <(find upload -name '*.php' -type f | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PHP files found" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "php -l ${file}"
            php -l "${file}"
          done

  xml:
    name: Validate install.xml
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the OCMOD manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse('install.xml')
          root = tree.getroot()

          assert root.tag == 'modification', root.tag
          for tag in ('name', 'code', 'version', 'author'):
              node = root.find(tag)
              assert node is not None and (node.text or '').strip(), f'missing <{tag}>'

          files = root.findall('file')
          assert files, 'no <file> operations declared'
          for file_node in files:
              path = file_node.get('path') or ''
              assert path.endswith('catalog/model/checkout/order.php'), path
              for operation in file_node.findall('operation'):
                  search = operation.find('search')
                  add = operation.find('add')
                  assert search is not None and (search.text or '').strip(), 'empty <search>'
                  assert add is not None and (add.text or '').strip(), 'empty <add>'

          print('install.xml is well-formed and complete')
          PY
